name: Install pinned go-task (Windows)
description: Install go-task 3.53.1 from its Windows release archive, verified against a pinned SHA-256.

runs:
  using: composite
  steps:
    - name: Download and verify go-task
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = 'task_windows_amd64.zip'
        $expected = '27c0cd248c12cba03d8958d954a3df981c900be885ec9ce5f6a3cdc4e9a19316'
        $work = Join-Path $env:RUNNER_TEMP 'go-task'
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        Invoke-WebRequest -Uri "https://github.com/go-task/task/releases/download/v3.53.1/$archive" -OutFile "$work\$archive"
        $actual = (Get-FileHash -Algorithm SHA256 "$work\$archive").Hash.ToLowerInvariant()
        if ($actual -ne $expected) { throw "go-task checksum mismatch: $actual" }
        Expand-Archive -Path "$work\$archive" -DestinationPath "$work\bin" -Force
        & "$work\bin\task.exe" --version
        "$work\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
