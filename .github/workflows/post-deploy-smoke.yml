name: TailTag post-deploy smoke

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: Classify post-deploy event
    runs-on: ubuntu-latest
    outputs:
      should_verify: ${{ steps.classify.outputs.should_verify }}
      checkout_ref: ${{ steps.classify.outputs.checkout_ref }}
      verification_mode: ${{ steps.classify.outputs.verification_mode }}
      deployment_sha: ${{ steps.classify.outputs.deployment_sha }}

    steps:
      - name: Check out trusted classifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Classify the trigger
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "should_verify=true"
              echo "checkout_ref=$GITHUB_SHA"
              echo "verification_mode=manual"
              echo "deployment_id=manual"
              echo "deployment_status_id=manual"
              echo "deployment_sha=not-applicable"
              echo "deployment_ref=not-applicable"
            } >> "$GITHUB_OUTPUT"
            echo "Manual Development endpoint smoke requested; deployment attribution unavailable."
          elif [[ "$EVENT_NAME" == "deployment_status" ]]; then
            python -m scripts.api_development_delivery_event
          else
            echo "should_verify=false" >> "$GITHUB_OUTPUT"
            echo "Skip unsupported trigger."
          fi

  verify:
    name: Verify development API over HTTP
    needs: classify
    if: needs.classify.outputs.should_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Check pinned public Development identity
        env:
          TAILTAG_DEVELOPMENT_API_BASE_URL: ${{ vars.TAILTAG_DEVELOPMENT_API_BASE_URL }}
          TAILTAG_EXPECTED_SOURCE_SHA: ${{ needs.classify.outputs.deployment_sha }}
          VERIFICATION_MODE: ${{ needs.classify.outputs.verification_mode }}
        run: |
          set -euo pipefail
          if [[ "$VERIFICATION_MODE" == "manual" ]]; then
            python -m scripts.api_staging_preflight --development-current > /dev/null
            echo "Current Development endpoint healthy; deployment attribution unavailable."
          elif [[ "$VERIFICATION_MODE" == "event" ]]; then
            python -m scripts.api_staging_preflight --development-candidate > /dev/null
            echo "Replacement Development event matches stable public source identity."
          else
            echo "Development verification mode unavailable."
            exit 1
          fi

      - name: Check out verifier revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.classify.outputs.checkout_ref }}
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.17"

      - name: Run canonical HTTP smoke verification
        env:
          API_BASE_URL: ${{ vars.TAILTAG_DEVELOPMENT_API_BASE_URL }}
        run: |
          set -euo pipefail
          uv --directory services/api sync --locked --no-dev
          API_BASE_URL="$API_BASE_URL" make api-smoke
