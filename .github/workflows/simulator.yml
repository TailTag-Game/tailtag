name: TailTag Simulator

on:
  pull_request:
    paths:
      - "tools/simulator/**"
      - "docs/operations/simulation-host.md"
      - "scripts/api_sim_pool_ssh.py"
      - "scripts/api_sim_fixture_ssh.py"
      - "scripts/api_sim_inspect_ssh.py"
      - "scripts/api_staging_reset_ssh.py"
      - "scripts/api_staging_preflight.py"
      - "services/api/pyproject.toml"
      - "services/api/uv.lock"
      - "services/api/simulation_fixtures/images/**"
      - ".semgrep/**"
      - "Makefile"
      - "scripts/validate_semgrep_contract.py"
      - ".github/workflows/simulator.yml"
  push:
    branches:
      - main
    paths:
      - "tools/simulator/**"
      - "docs/operations/simulation-host.md"
      - "scripts/api_sim_pool_ssh.py"
      - "scripts/api_sim_fixture_ssh.py"
      - "scripts/api_sim_inspect_ssh.py"
      - "scripts/api_staging_reset_ssh.py"
      - "scripts/api_staging_preflight.py"
      - "services/api/pyproject.toml"
      - "services/api/uv.lock"
      - "services/api/simulation_fixtures/images/**"
      - ".semgrep/**"
      - "Makefile"
      - "scripts/validate_semgrep_contract.py"
      - ".github/workflows/simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install locked uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Synchronize locked dependencies
        run: |
          uv --directory tools/simulator sync --all-groups --locked
          uv --directory .semgrep sync --locked

      # The Linux CLI signal test exercises real admission policy. Configure
      # only this disposable runner; no external host or workload is started.
      - name: Prepare disposable runner for host policy proof
        run: |
          sudo swapoff -a
          sudo sysctl -w 'kernel.core_pattern=|/bin/false'

      - name: Run canonical simulator validation
        run: |
          ulimit -c 0
          make sim-check

      - name: Build simulator image
        run: make sim-image PLATFORM=linux/amd64
