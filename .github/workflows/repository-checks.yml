name: Repository checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify required repository files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "CONTRIBUTING.md"
            ".github/CODEOWNERS"
            ".github/pull_request_template.md"
            ".github/ISSUE_TEMPLATE/01-bug-report.yml"
            ".github/ISSUE_TEMPLATE/02-feature-request.yml"
            ".github/ISSUE_TEMPLATE/03-work-item.yml"
            ".github/ISSUE_TEMPLATE/config.yml"
          )

          missing_files=()

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              missing_files+=("$file")
            fi
          done

          if (( ${#missing_files[@]} > 0 )); then
            echo "The following required files are missing:"
            printf ' - %s\n' "${missing_files[@]}"
            exit 1
          fi

      - name: Verify default code ownership
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Eq '^[*][[:space:]]+@TailTag-Game/core-maintainers([[:space:]]|$)' \
            .github/CODEOWNERS; then
            echo "CODEOWNERS must include the default Core Maintainers rule:"
            echo "* @TailTag-Game/core-maintainers"
            exit 1
          fi

      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t forbidden_files < <(
            git ls-files \
              | grep -E '(^|/)\.env($|\.)' \
              | grep -Ev '(^|/)\.env\.(example|sample|template)$' \
              || true
          )

          if (( ${#forbidden_files[@]} > 0 )); then
            echo "Environment files must not be committed:"
            printf ' - %s\n' "${forbidden_files[@]}"
            echo
            echo "Use .env.example, .env.sample, or .env.template for documented placeholders."
            exit 1
          fi

      - name: Verify issue-form types
        shell: bash
        run: |
          set -euo pipefail

          declare -A expected_types=(
            [".github/ISSUE_TEMPLATE/01-bug-report.yml"]="Bug"
            [".github/ISSUE_TEMPLATE/02-feature-request.yml"]="Feature"
            [".github/ISSUE_TEMPLATE/03-work-item.yml"]="Task"
          )

          for file in "${!expected_types[@]}"; do
            expected_type="${expected_types[$file]}"

            if ! grep -Eq "^type:[[:space:]]+${expected_type}[[:space:]]*$" "$file"; then
              echo "$file must contain:"
              echo "type: $expected_type"
              exit 1
            fi
          done

  replica-terraform:
    name: Replica Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # dorny/paths-filter lists the pull request files through the API.
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect replica Terraform changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            replica:
              - 'infra/replica/**'
              - '.github/workflows/repository-checks.yml'
              - 'Taskfile.yml'

      - name: Set up Terraform
        if: github.event_name != 'pull_request' || steps.filter.outputs.replica == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Install pinned go-task
        if: github.event_name != 'pull_request' || steps.filter.outputs.replica == 'true'
        uses: ./.github/actions/install-go-task

      - name: Check replica Terraform
        if: github.event_name != 'pull_request' || steps.filter.outputs.replica == 'true'
        run: task replica-tf-check

      - name: Report skipped replica Terraform checks
        if: github.event_name == 'pull_request' && steps.filter.outputs.replica != 'true'
        run: echo "No replica Terraform changes detected; checks skipped."
