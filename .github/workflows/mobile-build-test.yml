name: Mobile App Build Test
on:
  pull_request:
  push: # Quick post-push compile test
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-build-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs: 
      mobile: ${{ steps.filter.outputs.mobile || steps.skip-filter.outputs.mobile }}
    steps: 
      - name: Detect mobile app changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/mobile-build-test.yml'
      - name: Skip mobile app change detection
        id: skip-filter
        if: github.event_name != 'pull_request'
        run: echo "mobile=true" >> "$GITHUB_OUTPUT"
        
  android:
    name: Android Build Test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Java sanity check
        run: java --version
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/mobile/.fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Code format validation
        run: dart format --output=none --set-exit-if-changed .
      - name: Lint and analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build APK
        run: flutter build apk
      - name: Build AAB
        run: flutter build appbundle
  ios:
    name: iOS Build Test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/mobile/.fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build App
        run: flutter build ios --release --no-codesign
  mobile-validation:
    name: Mobile validation
    needs: 
      - changes
      - android
      - ios
    if: always()
    runs-on: ubuntu-latest
    steps: 
      - name: Validate build status
        env: 
          MOBILE_CHANGED: ${{ needs.changes.outputs.mobile }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          if [ "$MOBILE_CHANGED" != "true" ]; then
            echo "No mobile app changes."
            exit 0
          fi
          if [ "$ANDROID_RESULT" != "success" ]; then
            echo "Android build failed."
            exit 1
          fi
          if [ "$IOS_RESULT" != "success" ]; then
            echo "iOS build failed."
            exit 1
          fi
          echo "All builds succeeded."
          exit 0
