name: Mobile App Build Test
on:
  pull_request:
  push: # Post-merge compile test; no paths list, so every push to main runs.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.filter.outputs.mobile == 'true' || steps.filter.outputs.schema == 'true' || steps.skip-filter.outputs.mobile }}
    steps:
      - name: Detect mobile app changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Deny-list, so an unknown or new path fails safe by running mobile
          # CI. With `every`, a file matches only if it matches all patterns:
          # `**` plus the negations means "any file not excluded below".
          # Only paths that cannot affect the mobile app are excluded. The one
          # exception inside `services/api/**` is the committed OpenAPI schema
          # snapshot, the input to the generated mobile API client: the
          # separate `schema` filter runs mobile CI for it, while the rest of
          # `services/api/**` stays excluded.
          predicate-quantifier: 'every'
          filters: |
            mobile:
              - '**'
              - '!services/api/**'
              - '!tools/simulator/**'
              - '!.semgrep/**'
              - '!docs/**'
              - '!*.md'
              - '!scripts/api_*'
              - '!scripts/staging_*'
              - '!.github/workflows/api.yml'
              - '!.github/workflows/simulator.yml'
              - '!.github/workflows/post-deploy-smoke.yml'
            schema:
              - 'services/api/openapi/**'
      - name: Skip mobile app change detection
        id: skip-filter
        if: github.event_name != 'pull_request'
        run: echo "mobile=true" >> "$GITHUB_OUTPUT"

  android:
    name: Android Build Test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Java sanity check
        run: java --version
      - name: Install locked uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.17"
      - name: Install pinned go-task
        uses: ./.github/actions/install-go-task
      # Provides Dart for installing FVM. FVM then installs its own copy of the
      # same pinned SDK, which is what the task guards require.
      - name: Set up Flutter (provides Dart)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/mobile/.fvmrc
          cache: true
      - name: Install pinned FVM and the pinned Flutter SDK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          dart pub global activate fvm 4.3.1
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          export PATH="${PUB_CACHE:-$HOME/.pub-cache}/bin:$PATH"
          fvm --version
          fvm install --skip-pub-get
      - name: Install dependencies
        id: setup
        run: task mobile-setup
      - name: Format, analyze, and test
        id: check
        run: task mobile-check
      - name: Build APK
        id: apk
        working-directory: apps/mobile
        run: fvm flutter build apk
      - name: Build AAB
        id: aab
        working-directory: apps/mobile
        run: fvm flutter build appbundle
      - name: Point to the local command
        if: failure()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          APK_OUTCOME: ${{ steps.apk.outcome }}
          AAB_OUTCOME: ${{ steps.aab.outcome }}
        run: |
          if [ "$SETUP_OUTCOME" = "failure" ]; then
            cmd="task mobile-setup (repository root)"
          elif [ "$CHECK_OUTCOME" = "failure" ]; then
            cmd="task mobile-check (repository root)"
          elif [ "$APK_OUTCOME" = "failure" ]; then
            cmd="fvm flutter build apk (in apps/mobile)"
          elif [ "$AAB_OUTCOME" = "failure" ]; then
            cmd="fvm flutter build appbundle (in apps/mobile)"
          else
            cmd="task mobile-doctor (repository root); see docs/development/mobile.md"
          fi
          echo "::error title=Android Build Test failed::Reproduce locally with: ${cmd}"
          {
            echo "### Android Build Test failed"
            echo
            echo "Reproduce locally with: \`${cmd}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS Build Test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install locked uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.17"
      - name: Install pinned go-task
        uses: ./.github/actions/install-go-task
      # Provides Dart for installing FVM. FVM then installs its own copy of the
      # same pinned SDK, which is what the task guards require.
      - name: Set up Flutter (provides Dart)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/mobile/.fvmrc
          cache: true
      - name: Install pinned FVM and the pinned Flutter SDK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          dart pub global activate fvm 4.3.1
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          export PATH="${PUB_CACHE:-$HOME/.pub-cache}/bin:$PATH"
          fvm --version
          fvm install --skip-pub-get
      - name: Install dependencies
        id: setup
        run: task mobile-setup
      - name: Build App
        id: build
        working-directory: apps/mobile
        run: fvm flutter build ios --release --no-codesign
      - name: Point to the local command
        if: failure()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$SETUP_OUTCOME" = "failure" ]; then
            cmd="task mobile-setup (repository root)"
          elif [ "$BUILD_OUTCOME" = "failure" ]; then
            cmd="fvm flutter build ios --release --no-codesign (in apps/mobile, on macOS)"
          else
            cmd="task mobile-doctor (repository root); see docs/development/mobile.md"
          fi
          echo "::error title=iOS Build Test failed::Reproduce locally with: ${cmd}"
          {
            echo "### iOS Build Test failed"
            echo
            echo "Reproduce locally with: \`${cmd}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  mobile-validation:
    name: Mobile validation
    needs:
      - changes
      - android
      - ios
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MOBILE_CHANGED: ${{ needs.changes.outputs.mobile }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Mobile change detection failed."
            exit 1
          fi
          if [ "$MOBILE_CHANGED" != "true" ]; then
            echo "No mobile app changes."
            exit 0
          fi
          if [ "$ANDROID_RESULT" != "success" ]; then
            echo "Android build failed."
            exit 1
          fi
          if [ "$IOS_RESULT" != "success" ]; then
            echo "iOS build failed."
            exit 1
          fi
          echo "All builds succeeded."
          exit 0
