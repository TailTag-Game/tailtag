name: TailTag API

on:
  # Documentation-only changes start no app workflow. Keep this list equal to
  # _APP_PATHS in scripts/render_development_deploy.py.
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'services/api/**'
      - '.semgrep/**'
      - 'docs/operations/simulation-host.md'
      - 'docs/development/staging.md'
      - 'docs/development/backend-delivery-operations.md'
      - 'docs/operations/operator-authorization-audit.md'
      - 'docs/operations/catch-administration.md'
      - 'docs/specs/README.md'
      - 'docs/specs/2026-09-22-v0-migration-application-rollback.md'
      - 'docs/specs/2026-09-22-v0-migration-application-rollback-implementation-plan.md'
      - 'docs/development/staging-recovery/2026-09-22-issue-206-no-go.json'
  push:
    branches:
      - main
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'services/api/**'
      - '.semgrep/**'
      - 'docs/operations/simulation-host.md'
      - 'docs/development/staging.md'
      - 'docs/development/backend-delivery-operations.md'
      - 'docs/operations/operator-authorization-audit.md'
      - 'docs/operations/catch-administration.md'
      - 'docs/specs/README.md'
      - 'docs/specs/2026-09-22-v0-migration-application-rollback.md'
      - 'docs/specs/2026-09-22-v0-migration-application-rollback-implementation-plan.md'
      - 'docs/development/staging-recovery/2026-09-22-issue-206-no-go.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API foundation checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tailtag
          POSTGRES_USER: tailtag
          POSTGRES_PASSWORD: tailtag
        options: >-
          --health-cmd "pg_isready -U tailtag -d tailtag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://tailtag:tailtag@localhost:5432/tailtag
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
      MEDIA_STORAGE_ENDPOINT_URL: https://media.example.test
      MEDIA_STORAGE_BUCKET_NAME: ci-media-bucket
      MEDIA_STORAGE_REGION: auto
      MEDIA_STORAGE_ACCESS_KEY_ID: ci-not-a-real-access-key
      MEDIA_STORAGE_SECRET_ACCESS_KEY: ci-not-a-real-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine backend validation relevance
        id: relevance
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$RUNNER_TEMP/backend-changed-files"
            git diff --name-only -z "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$changed_files"
            python3 scripts/backend_ci_relevance.py \
              --changed-files "$changed_files" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/backend_ci_relevance.py \
              --force-run \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.relevance.outputs.backend_relevant == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install locked uv
        if: steps.relevance.outputs.backend_relevant == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Synchronize locked dependencies
        if: steps.relevance.outputs.backend_relevant == 'true'
        run: |
          uv --directory services/api sync --all-groups --locked
          uv --directory .semgrep sync --locked

      - name: Install pinned go-task
        if: steps.relevance.outputs.backend_relevant == 'true'
        uses: ./.github/actions/install-go-task

      - name: Run canonical API validation
        if: steps.relevance.outputs.backend_relevant == 'true'
        run: task api-check

      - name: Report skipped backend validation
        if: steps.relevance.outputs.backend_relevant != 'true'
        run: echo "No backend-relevant changes detected; backend validation skipped."
