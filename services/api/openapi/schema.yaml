      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  handle:
                    type: string
                    nullable: true
                    readOnly: true
                  display_name:
                    type: string
                    nullable: true
                    readOnly: true
                  avatar_url:
                    type: string
                    format: uri
                    nullable: true
                    readOnly: true
                  onboarding_complete:
                    type: boolean
                    readOnly: true
                  is_enabled:
                    type: boolean
                    readOnly: true
                required:
                - handle
                - display_name
                - avatar_url
                - onboarding_complete
                - is_enabled
          description: ''
        '400':
          description: The supplied profile fields are invalid.
        '401':
          description: Authentication credentials were not provided.
        '403':
