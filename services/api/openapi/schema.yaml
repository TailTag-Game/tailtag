components:
  schemas:
    ActiveConventionResponse:
      type: object
      description: Response wrapper for active convention enrollment query.
      properties:
        enrollment:
          allOf:
          - $ref: '#/components/schemas/ConventionEnrollment'
          nullable: true
      required:
      - enrollment
      additionalProperties: false
    AvatarPut:
      type: object
      properties:
        avatar:
          type: string
          format: binary
      required:
      - avatar
    CatchConfirmationRequestSchema:
      type: object
      additionalProperties: false
      properties:
        payload:
          type: string
          pattern: ^tailtag:catch:v1:[A-Za-z0-9_-]{43}$
      required:
      - payload
    CatchConfirmationResponseSchema:
      type: object
      additionalProperties: false
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        catch:
          type: object
          additionalProperties: false
          readOnly: true
          properties:
            id:
              type: integer
              readOnly: true
            caught_at:
              type: string
              format: date-time
              readOnly: true
            convention_id:
              type: integer
              readOnly: true
            fursuit:
              type: object
              additionalProperties: false
              readOnly: true
              properties:
                tailtag_id:
                  type: string
                  format: uuid
                  readOnly: true
                name:
                  type: string
                  readOnly: true
                photo_url:
                  type: string
                  format: uri
                  readOnly: true
              required:
              - tailtag_id
              - name
              - photo_url
          required:
          - id
          - caught_at
          - convention_id
          - fursuit
      required:
      - outcome
      - catch
    CatchHistoryResponseSchema:
      type: object
      additionalProperties: false
      properties:
        catch_count:
          type: integer
          minimum: 0
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: integer
                readOnly: true
              fursuit:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: integer
                    readOnly: true
                  name:
                    type: string
                    readOnly: true
                  photo_url:
                    type: string
                    format: uri
                    readOnly: true
                required:
                - id
                - name
                - photo_url
              convention:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: integer
                    readOnly: true
                  name:
                    type: string
                    readOnly: true
                required:
                - id
                - name
              caught_at:
                type: string
                format: date-time
                readOnly: true
            required:
            - id
            - fursuit
            - convention
            - caught_at
      required:
      - catch_count
      - next
      - previous
      - results
    Convention:
      type: object
      description: Serializer exposing safe, read-only convention representation.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          description: The official name of the convention.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          description: |-
            Operational lifecycle state of the convention.

            * `draft` - Draft
            * `active` - Active
            * `paused` - Paused
            * `completed` - Completed
            * `cancelled` - Cancelled
        start_date:
          type: string
          format: date
          readOnly: true
          description: Start date of the convention.
        end_date:
          type: string
          format: date
          readOnly: true
          description: End date of the convention.
      required:
      - end_date
      - id
      - name
      - start_date
      - status
      additionalProperties: false
    ConventionEnrollRequest:
      type: object
      description: Request serializer for enrolling into an active convention.
      properties:
        convention_id:
          type: integer
          minimum: 1
        set_active:
          type: boolean
          default: false
      required:
      - convention_id
      additionalProperties: false
    ConventionEnrollment:
      type: object
      description: Serializer for convention enrollments.
      properties:
        id:
          type: integer
          readOnly: true
        convention:
          allOf:
          - $ref: '#/components/schemas/Convention'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: Whether this convention is the player's selected active gameplay
            convention.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - convention
      - created_at
      - id
      - is_active
      additionalProperties: false
    OutcomeEnum:
      type: string
      enum:
      - created
      - already_caught
    PatchedProfilePatch:
      type: object
      properties:
        handle:
          type: string
        display_name:
          type: string
      additionalProperties: false
    ProfilePut:
      type: object
      properties:
        handle:
          type: string
        display_name:
          type: string
      required:
      - display_name
      - handle
      additionalProperties: false
    SelectActiveConventionRequest:
      type: object
      description: Request serializer for selecting an active convention.
      properties:
        convention_id:
          type: integer
          minimum: 1
      required:
      - convention_id
      additionalProperties: false
    StatusEnum:
      enum:
      - draft
      - active
      - paused
      - completed
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `active` - Active
        * `paused` - Paused
        * `completed` - Completed
        * `cancelled` - Cancelled
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
