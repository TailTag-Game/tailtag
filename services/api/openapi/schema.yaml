openapi: 3.0.3
info:
  title: TailTag API
  version: 0.1.0
  description: TailTag V0 API foundation.
paths:
  /api/catches/:
    get:
      operationId: catch_history_list
      description: Returns only the authenticated player's Catch history ordered by
        -caught_at then -id. catch_count is the total number of matching Catch rows
        before pagination. Each supported query parameter may appear at most once;
        unknown query parameters are rejected.
      parameters:
      - in: query
        name: convention_id
        schema:
          type: integer
          minimum: 1
        description: Optional positive ASCII decimal Convention identifier.
        explode: true
        style: form
        required: false
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Optional positive ASCII decimal page number; defaults to 1.
        explode: true
        style: form
        required: false
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Optional positive ASCII decimal page size from 1 through 100;
          defaults to 20.
        explode: true
        style: form
        required: false
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchHistoryResponseSchema'
          description: Returns the current player's matching Catch rows. An existing
            Convention with no catches returns 200 with empty results.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - invalid_query
                  detail:
                    type: string
                required:
                - code
                - detail
          description: The catch-history query is invalid.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication is required.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - convention_not_found
                    - invalid_page
                  detail:
                    type: string
                required:
                - code
                - detail
          description: A missing Convention returns 404; an out-of-range page also
            returns 404.
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                required:
                - code
                - detail
          description: A photo signing failure returns a sanitized 500 for the whole
            request.
  /api/catches/confirm/:
    post:
      operationId: catch_confirm
      description: Delegate one opaque credential to the sole catch-write authority.
      tags:
      - catches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchConfirmationRequestSchema'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchConfirmationResponseSchema'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchConfirmationResponseSchema'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  payload:
                    type: array
                    items:
                      type: string
                required:
                - payload
          description: The supplied catch credential payload is invalid.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - catcher_ineligible
                  detail:
                    type: string
                required:
                - code
                - detail
          description: Request not permitted.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - catch_target_unavailable
                  detail:
                    type: string
                required:
                - code
                - detail
          description: The target is unavailable; privacy-collapsed outcomes are indistinguishable.
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - active_convention_mismatch
                    - self_catch_not_allowed
                  detail:
                    type: string
                required:
                - code
                - detail
          description: The catch cannot be confirmed in the active convention.
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                required:
                - code
                - detail
          description: An unexpected error occurred.
  /api/conventions/:
    get:
      operationId: conventions_list
      description: Retrieve a list of conventions with safe public fields for enrollment.
      summary: List conventions
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Convention'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided or are invalid.
  /api/conventions/{convention_id}/catch-credentials/resolve/:
    post:
      operationId: convention_fursuit_catch_credential_resolve
      description: Resolve an opaque catch credential to a safe current preview only.
        This is not catch authorization; future Wave 3 catch writes must submit and
        independently revalidate the original payload.
      parameters:
      - in: path
        name: convention_id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                payload:
                  type: string
                  pattern: ^tailtag:catch:v1:[A-Za-z0-9_-]{43}$
              required:
              - payload
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  convention_id:
                    type: integer
                    readOnly: true
                  fursuit:
                    type: object
                    additionalProperties: false
                    readOnly: true
                    properties:
                      tailtag_id:
                        type: string
                        format: uuid
                        readOnly: true
                      name:
                        type: string
                        readOnly: true
                      photo_url:
                        type: string
                        format: uri
                        readOnly: true
                    required:
                    - tailtag_id
                    - name
                    - photo_url
                required:
                - convention_id
                - fursuit
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  payload:
                    type: array
                    items:
                      type: string
                required:
                - payload
          description: The supplied catch credential payload is invalid.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The player profile is not eligible for participation.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Catch credential not found.
        '405':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Method not allowed.
  /api/conventions/{convention_id}/fursuit-activations/:
    get:
      operationId: convention_fursuit_activations_list
      description: Return existing owner selections in ascending fursuit_id order.
        is_active is the stored selection; is_eligible is computed from current upstream
        state. Operational participation requires both.
      parameters:
      - in: path
        name: convention_id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    fursuit_id:
                      type: integer
                      readOnly: true
                    convention_id:
                      type: integer
                      readOnly: true
                    is_active:
                      type: boolean
                      readOnly: true
                    is_eligible:
                      type: boolean
                      readOnly: true
                    activated_at:
                      type: string
                      format: date-time
                      readOnly: true
                    deactivated_at:
                      type: string
                      format: date-time
                      nullable: true
                      readOnly: true
                  required:
                  - fursuit_id
                  - convention_id
                  - is_active
                  - is_eligible
                  - activated_at
                  - deactivated_at
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The requested resource was not found.
        '405':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Method not allowed.
  /api/conventions/{convention_id}/fursuit-activations/{fursuit_id}/:
    put:
      operationId: convention_fursuit_activations_set_state
      description: Idempotently set the stored is_active owner selection. is_eligible
        is computed from current upstream state; operational participation requires
        both the stored selection and computed eligibility.
      parameters:
      - in: path
        name: convention_id
        schema:
          type: integer
        required: true
      - in: path
        name: fursuit_id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                is_active:
                  type: boolean
              required:
              - is_active
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  fursuit_id:
                    type: integer
                    readOnly: true
                  convention_id:
                    type: integer
                    readOnly: true
                  is_active:
                    type: boolean
                    readOnly: true
                  is_eligible:
                    type: boolean
                    readOnly: true
                  activated_at:
                    type: string
                    format: date-time
                    readOnly: true
                  deactivated_at:
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                required:
                - fursuit_id
                - convention_id
                - is_active
                - is_eligible
                - activated_at
                - deactivated_at
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  is_active:
                    type: array
                    items:
                      type: string
                required:
                - is_active
          description: The supplied activation state is invalid.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The player profile is not eligible for participation.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The requested resource was not found.
        '405':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Method not allowed.
  /api/conventions/{convention_id}/fursuit-activations/{fursuit_id}/catch-credential/:
    get:
      operationId: convention_fursuit_catch_credential_get
      description: Return the owner's current opaque catch credential, creating it
        lazily when absent. This does not start a catch session and is not catch authorization.
      parameters:
      - in: path
        name: convention_id
        schema:
          type: integer
        required: true
      - in: path
        name: fursuit_id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  payload:
                    type: string
                    pattern: ^tailtag:catch:v1:[A-Za-z0-9_-]{43}$
                required:
                - payload
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The supplied activation state is invalid.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The player profile is not eligible for participation.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The requested resource was not found.
        '405':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Method not allowed.
  /api/conventions/{convention_id}/fursuit-activations/{fursuit_id}/catch-credential/rotate/:
    post:
      operationId: convention_fursuit_catch_credential_rotate
      description: Revoke the owner's current opaque catch credential and create a
        replacement. The request accepts zero body bytes only and is not catch authorization.
      parameters:
      - in: path
        name: convention_id
        schema:
          type: integer
        required: true
      - in: path
        name: fursuit_id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  payload:
                    type: string
                    pattern: ^tailtag:catch:v1:[A-Za-z0-9_-]{43}$
                required:
                - payload
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The supplied activation state is invalid.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The player profile is not eligible for participation.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The requested resource was not found.
        '405':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Method not allowed.
  /api/conventions/{convention_id}/fursuit-activations/{fursuit_id}/catch-session/:
    put:
      operationId: convention_fursuit_catch_session_set_state
      description: Idempotently set the desired current catchability. A live session
        has a fixed 12-hour expiration; is_active is computed from unexpired session
        state and current operational participation. This endpoint is not catch authorization
        and catch creation must revalidate its own requirements.
      parameters:
      - in: path
        name: convention_id
        schema:
          type: integer
        required: true
      - in: path
        name: fursuit_id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                is_active:
                  type: boolean
              required:
              - is_active
      security:
      - BearerAuth: []
      responses:
        '200':
          description: The canonical desired catch-session state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  fursuit_id:
                    type: integer
                    readOnly: true
                  convention_id:
                    type: integer
                    readOnly: true
                  is_active:
                    type: boolean
                    readOnly: true
                  started_at:
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                  ended_at:
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                  end_reason:
                    type: string
                    nullable: true
                    enum:
                    - owner
                    - operator
                    - eligibility_lost
                    - expired
                    readOnly: true
                required:
                - fursuit_id
                - convention_id
                - is_active
                - started_at
                - expires_at
                - ended_at
                - end_reason
        '400':
          description: The supplied activation state is invalid.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: The player profile is not eligible for participation.
        '404':
          description: The requested resource was not found.
        '405':
          description: Method not allowed.
  /api/conventions/{id}/:
    get:
      operationId: conventions_retrieve
      description: Retrieve convention details by internal ID.
      summary: Retrieve convention
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Convention'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided or are invalid.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: No convention found matching the given ID.
  /api/conventions/active/:
    get:
      operationId: conventions_active_retrieve
      description: Retrieve the authenticated player's currently selected active convention
        enrollment, if any.
      summary: Get active convention
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveConventionResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided or are invalid.
    put:
      operationId: conventions_active_update
      description: Explicitly select an enrolled active convention as the player's
        active gameplay context.
      summary: Select active convention
      tags:
      - conventions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectActiveConventionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectActiveConventionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectActiveConventionRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveConventionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  convention_id:
                    type: array
                    items:
                      type: string
          description: Convention does not exist, is not enrolled, or is not in an
            active playable state.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided or are invalid.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The player profile is not eligible for participation.
    delete:
      operationId: conventions_active_destroy
      description: Clear the authenticated player's active convention selection.
      summary: Clear active convention
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Active convention selection was cleared.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided or are invalid.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: The player profile is not eligible for participation.
  /api/conventions/enrollments/:
    get:
      operationId: conventions_enrollments_list
      description: Retrieve a list of all convention enrollments for the authenticated
        player.
      summary: List convention enrollments
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConventionEnrollment'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided or are invalid.
    post:
      operationId: conventions_enrollments_create
      description: Enroll the authenticated player into an active convention. Idempotent
        on retry.
      summary: Enroll in convention
      tags:
      - conventions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConventionEnrollRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConventionEnrollRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConventionEnrollRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConventionEnrollment'
          description: User was already enrolled; existing enrollment returned.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConventionEnrollment'
          description: Successfully enrolled in the convention.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  convention_id:
                    type: array
                    items:
                      type: string
          description: Convention is not open for enrollment.
        '401':
          content:
