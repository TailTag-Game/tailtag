    put:
      operationId: convention_fursuit_catch_session_set_state
      description: Idempotently set the desired current catchability. A live session
        has a fixed 12-hour expiration; is_active is computed from unexpired session
        state and current operational participation. This endpoint is not catch authorization
        and catch creation must revalidate its own requirements.
      parameters:
      - in: path
        name: convention_id
        schema:
          type: integer
        required: true
      - in: path
        name: fursuit_id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                is_active:
                  type: boolean
              required:
              - is_active
      security:
      - BearerAuth: []
      responses:
        '200':
          description: The canonical desired catch-session state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  fursuit_id:
                    type: integer
                    readOnly: true
                  convention_id:
                    type: integer
                    readOnly: true
                  is_active:
                    type: boolean
                    readOnly: true
                  started_at:
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                  ended_at:
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                  end_reason:
                    type: string
                    nullable: true
                    enum:
                    - owner
                    - operator
                    - eligibility_lost
                    - expired
                    readOnly: true
                required:
                - fursuit_id
                - convention_id
                - is_active
                - started_at
                - expires_at
                - ended_at
                - end_reason
        '400':
          description: The supplied activation state is invalid.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: The player profile is not eligible for participation.
        '404':
          description: The requested resource was not found.
        '405':
          description: Method not allowed.
