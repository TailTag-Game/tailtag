components:
  schemas:
    ActiveConventionResponse:
      type: object
      description: Response wrapper for active convention enrollment query.
      properties:
        enrollment:
          allOf:
          - $ref: '#/components/schemas/ConventionEnrollment'
          nullable: true
      required:
      - enrollment
      additionalProperties: false
    AvatarPut:
      type: object
      properties:
        avatar:
          type: string
          format: binary
      required:
      - avatar
    CatchConfirmationRequestSchema:
      type: object
      additionalProperties: false
      properties:
        payload:
          type: string
          pattern: ^tailtag:catch:v1:[A-Za-z0-9_-]{43}$
      required:
      - payload
    CatchConfirmationResponseSchema:
      type: object
      additionalProperties: false
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        catch:
          type: object
          additionalProperties: false
          readOnly: true
          properties:
            id:
              type: integer
              readOnly: true
            caught_at:
              type: string
              format: date-time
              readOnly: true
            convention_id:
              type: integer
              readOnly: true
            fursuit:
              type: object
              additionalProperties: false
              readOnly: true
              properties:
                tailtag_id:
                  type: string
                  format: uuid
                  readOnly: true
                name:
                  type: string
                  readOnly: true
                photo_url:
                  type: string
                  format: uri
                  readOnly: true
              required:
              - tailtag_id
              - name
              - photo_url
          required:
          - id
          - caught_at
          - convention_id
          - fursuit
      required:
      - outcome
      - catch
    CatchHistoryResponseSchema:
      type: object
      additionalProperties: false
      properties:
        catch_count:
          type: integer
          minimum: 0
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: integer
                readOnly: true
              fursuit:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: integer
                    readOnly: true
                  name:
                    type: string
                    readOnly: true
                  photo_url:
                    type: string
                    format: uri
                    readOnly: true
                required:
                - id
                - name
                - photo_url
              convention:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: integer
                    readOnly: true
                  name:
                    type: string
                    readOnly: true
                required:
                - id
                - name
              caught_at:
                type: string
                format: date-time
                readOnly: true
            required:
            - id
            - fursuit
            - convention
            - caught_at
      required:
      - catch_count
      - next
      - previous
      - results
    Convention:
      type: object
      description: Serializer exposing safe, read-only convention representation.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          description: The official name of the convention.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          description: |-
            Operational lifecycle state of the convention.

            * `draft` - Draft
            * `active` - Active
            * `paused` - Paused
            * `completed` - Completed
            * `cancelled` - Cancelled
        start_date:
          type: string
          format: date
          readOnly: true
          description: Start date of the convention.
        end_date:
          type: string
          format: date
          readOnly: true
          description: End date of the convention.
        time_zone:
          type: string
          readOnly: true
          nullable: true
          description: IANA time zone of the convention. Catch requests stay unavailable
            until an operator sets it. A set zone cannot be removed.
        review_deadline_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the catch request review window closes. The server computes
            it from the end date and time zone.
        review_deadline_local_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        review_open:
          type: boolean
          readOnly: true
      required:
      - end_date
      - id
      - name
      - review_deadline_at
      - review_deadline_local_date
      - review_open
      - start_date
      - status
      - time_zone
      additionalProperties: false
    ConventionEnrollRequest:
      type: object
      description: Request serializer for enrolling into an active convention.
      properties:
        convention_id:
          type: integer
          minimum: 1
        set_active:
          type: boolean
          default: false
      required:
      - convention_id
      additionalProperties: false
    ConventionEnrollment:
      type: object
      description: Serializer for convention enrollments.
      properties:
        id:
          type: integer
          readOnly: true
        convention:
          allOf:
          - $ref: '#/components/schemas/Convention'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: Whether this convention is the player's selected active gameplay
            convention.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - convention
      - created_at
      - id
      - is_active
      additionalProperties: false
    OutcomeEnum:
      type: string
      enum:
      - created
      - already_caught
    PatchedProfilePatch:
      type: object
      properties:
        handle:
          type: string
        display_name:
          type: string
      additionalProperties: false
    ProfilePut:
      type: object
      properties:
        handle:
          type: string
        display_name:
          type: string
      required:
      - display_name
      - handle
      additionalProperties: false
    SelectActiveConventionRequest:
      type: object
      description: Request serializer for selecting an active convention.
      properties:
        convention_id:
          type: integer
          minimum: 1
      required:
      - convention_id
      additionalProperties: false
    StatusEnum:
      enum:
      - draft
      - active
      - paused
      - completed
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `active` - Active
        * `paused` - Paused
        * `completed` - Completed
        * `cancelled` - Cancelled
    CatchApprovalMode:
      type: string
      enum:
      - manual
      - automatic
      description: manual by default. A change applies only to new requests.
    CatchRequestState:
      type: string
      enum:
      - pending
      - approved
      - declined
      - withdrawn
      - unavailable
    CatchRequestOutcome:
      type: string
      enum:
      - pending
      - approved
      - already_pending
      - already_caught
    FursuitSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        tailtag_id:
          type: string
          format: uuid
        name:
          type: string
        photo_url:
          type: string
          format: uri
      required:
      - id
      - tailtag_id
      - name
      - photo_url
    PlayerRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        fursuit:
          $ref: '#/components/schemas/FursuitSummary'
        convention_id:
          type: integer
        state:
          $ref: '#/components/schemas/CatchRequestState'
        requested_at:
          type: string
          format: date-time
        review_deadline_at:
          type: string
          format: date-time
      required:
      - id
      - fursuit
      - convention_id
      - state
      - requested_at
      - review_deadline_at
    PlayerRequestList:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PlayerRequest'
      required:
      - results
    RequestCatch:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        caught_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
        convention_id:
          type: integer
        fursuit:
          type: object
          additionalProperties: false
          properties:
            tailtag_id:
              type: string
              format: uuid
            name:
              type: string
            photo_url:
              type: string
              format: uri
          required:
          - tailtag_id
          - name
          - photo_url
      required:
      - id
      - caught_at
      - approved_at
      - convention_id
      - fursuit
    CatchRequestSubmission:
      type: object
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/CatchRequestOutcome'
        request:
          $ref: '#/components/schemas/PlayerRequest'
          nullable: true
        catch:
          $ref: '#/components/schemas/RequestCatch'
          nullable: true
      required:
      - outcome
      - request
      - catch
    CatchRequestPayload:
      type: object
      additionalProperties: false
      properties:
        payload:
          type: string
          description: The full scanned tag payload, https://tailtag.app/t#<token>.
      required:
      - payload
    CatchRequestError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    CatchRequestNotFound:
      type: object
      additionalProperties: false
      description: catch_target_unavailable carries code and detail. While the gate
        is off, the generic not-found body carries detail only.
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - detail
    DetailError:
      type: object
      additionalProperties: false
      properties:
        detail:
          type: string
      required:
      - detail
    CatchRequestRefusal:
      type: object
      additionalProperties: false
      description: cooldown_active or rate_limited. The Retry-After header carries
        the same number of seconds.
      properties:
        code:
          type: string
          enum:
          - cooldown_active
          - rate_limited
        detail:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 1
      required:
      - code
      - detail
      - retry_after_seconds
    CatchRequestActionError:
      type: object
      additionalProperties: false
      description: request_state_changed carries the current state. Other codes carry
        code and detail only.
      properties:
        code:
          type: string
        detail:
          type: string
        state:
          $ref: '#/components/schemas/CatchRequestState'
      required:
      - code
      - detail
    CatchRequestActionNotFound:
      type: object
      additionalProperties: false
      description: request_not_found carries code and detail. While the gate is off,
        the generic not-found body carries detail only.
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - detail
    CatchRequestDecline:
      type: object
      additionalProperties: false
      properties:
        block:
          type: boolean
          description: True also blocks the player for this suit here.
      required:
      - block
    OwnerRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        fursuit:
          $ref: '#/components/schemas/FursuitSummary'
        convention_id:
          type: integer
        player:
          type: object
          additionalProperties: false
          properties:
            display_name:
              type: string
            handle:
              type: string
          required:
          - display_name
          - handle
        state:
          $ref: '#/components/schemas/CatchRequestState'
        requested_at:
          type: string
          format: date-time
        undo_available_until:
          type: string
          format: date-time
          nullable: true
        prior_decline_count:
          type: integer
        player_blocked:
          type: boolean
        approval_paused:
          type: boolean
        review_deadline_at:
          type: string
          format: date-time
      required:
      - id
      - fursuit
      - convention_id
      - player
      - state
      - requested_at
      - undo_available_until
      - prior_decline_count
      - player_blocked
      - approval_paused
      - review_deadline_at
    OwnerRequestList:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/OwnerRequest'
      required:
      - results
    OwnerRequestSummary:
      type: object
      additionalProperties: false
      properties:
        pending_count:
          type: integer
        fursuits:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              fursuit_id:
                type: integer
              pending_count:
                type: integer
            required:
            - fursuit_id
            - pending_count
      required:
      - pending_count
      - fursuits
    OwnerApproval:
      type: object
      additionalProperties: false
      properties:
        request:
          $ref: '#/components/schemas/OwnerRequest'
        catch:
          $ref: '#/components/schemas/RequestCatch'
      required:
      - request
      - catch
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
