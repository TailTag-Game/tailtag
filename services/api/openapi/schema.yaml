openapi: 3.0.3
info:
  title: TailTag API
  version: 0.1.0
  description: TailTag V0 API foundation.
paths:
  /api/catches/:
    get:
      operationId: catch_history_list
      description: Returns only the authenticated player's Catch history ordered by
        -caught_at then -id. catch_count is the total number of matching Catch rows
        before pagination. Each supported query parameter may appear at most once;
        unknown query parameters are rejected.
      parameters:
      - in: query
        name: convention_id
        schema:
          type: integer
          minimum: 1
        description: Optional positive ASCII decimal Convention identifier.
        explode: true
        style: form
        required: false
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Optional positive ASCII decimal page number; defaults to 1.
        explode: true
        style: form
        required: false
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Optional positive ASCII decimal page size from 1 through 100;
          defaults to 20.
        explode: true
        style: form
        required: false
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchHistoryResponseSchema'
          description: Returns the current player's matching Catch rows. An existing
            Convention with no catches returns 200 with empty results.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - invalid_query
                  detail:
                    type: string
                required:
                - code
                - detail
          description: The catch-history query is invalid.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication is required.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - convention_not_found
                    - invalid_page
                  detail:
                    type: string
                required:
                - code
                - detail
          description: A missing Convention returns 404; an out-of-range page also
            returns 404.
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                required:
                - code
                - detail
          description: A photo signing failure returns a sanitized 500 for the whole
            request.
  /api/catches/confirm/:
    post:
      operationId: catch_confirm
      description: Delegate one opaque credential to the sole catch-write authority.
      tags:
      - catches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchConfirmationRequestSchema'
        required: true
      security:
      - BearerAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchConfirmationResponseSchema'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchConfirmationResponseSchema'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  payload:
                    type: array
                    items:
                      type: string
                required:
                - payload
          description: The supplied catch credential payload is invalid.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - catcher_ineligible
                  detail:
                    type: string
                required:
                - code
                - detail
          description: Request not permitted.
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - catch_target_unavailable
                  detail:
                    type: string
                required:
                - code
                - detail
          description: The target is unavailable; privacy-collapsed outcomes are indistinguishable.
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - active_convention_mismatch
                    - self_catch_not_allowed
                  detail:
                    type: string
                required:
                - code
                - detail
          description: The catch cannot be confirmed in the active convention.
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                required:
                - code
                - detail
          description: An unexpected error occurred.
  /api/catches/incoming-requests/:
    get:
      operationId: catch_incoming_requests_list
      description: List requests on the caller's suits, newest first, for conventions
        whose review window is open.
      parameters:
      - in: query
        name: convention_id
        schema:
          type: integer
        description: Limit the list to one convention.
      - in: query
        name: fursuit_id
        schema:
          type: integer
        description: Limit the list to one suit.
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRequestList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: 'invalid_query: a filter is not a positive integer.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The caller has no enabled, completed profile.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The catch request gate is off.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/catches/incoming-requests/{id}/approve/:
    post:
      operationId: catch_incoming_requests_approve
      description: Approve a pending request. The catch time is the request time.
        A repeat returns the same catch.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerApproval'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The caller has no enabled, completed profile.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionNotFound'
          description: request_not_found. While the catch request gate is off, every
            call returns the generic not-found shape.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionError'
          description: request_state_changed, review_window_closed, approval_paused,
            request_superseded
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/catches/incoming-requests/{id}/block/:
    delete:
      operationId: catch_incoming_requests_unblock
      description: Remove the block for this request's player, suit, and convention.
        The cooldown stays. No block in place also returns 204.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '204':
          description: The block is gone.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The caller has no enabled, completed profile.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionNotFound'
          description: request_not_found. While the catch request gate is off, every
            call returns the generic not-found shape.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionError'
          description: review_window_closed
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/catches/incoming-requests/{id}/decline/:
    post:
      operationId: catch_incoming_requests_decline
      description: Decline a pending request. No reason is needed. With block true,
        the player is also blocked for this suit at this convention.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchRequestDecline'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRequest'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: 'invalid_request: the body needs one boolean block.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The caller has no enabled, completed profile.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionNotFound'
          description: request_not_found. While the catch request gate is off, every
            call returns the generic not-found shape.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionError'
          description: request_state_changed, review_window_closed
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/catches/incoming-requests/{id}/restore/:
    post:
      operationId: catch_incoming_requests_restore
      description: Restore a declined request to pending before the review deadline.
        An active block stays.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRequest'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The caller has no enabled, completed profile.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionNotFound'
          description: request_not_found. While the catch request gate is off, every
            call returns the generic not-found shape.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionError'
          description: request_state_changed, review_window_closed, request_superseded
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/catches/incoming-requests/{id}/undo-decline/:
    post:
      operationId: catch_incoming_requests_undo_decline
      description: Undo an ordinary decline within 10 seconds. The request returns
        to pending, and the decline no longer counts.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRequest'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The caller has no enabled, completed profile.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionNotFound'
          description: request_not_found. While the catch request gate is off, every
            call returns the generic not-found shape.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionError'
          description: request_state_changed, review_window_closed, undo_expired,
            request_superseded
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/catches/incoming-requests/summary/:
    get:
      operationId: catch_incoming_requests_summary
      description: Count pending requests on the caller's suits in open windows.
      parameters:
      - in: query
        name: convention_id
        schema:
          type: integer
        description: Limit the counts to one convention.
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRequestSummary'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: 'invalid_query: a filter is not a positive integer.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The caller has no enabled, completed profile.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The catch request gate is off.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/catches/preview/:
    post:
      operationId: catch_preview
      description: Resolve a scanned tag against the caller's selected convention.
        Preview creates nothing. Unknown, revoked, and unavailable targets share one
        neutral 404.
      tags:
      - catches
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                payload:
                  type: string
                  description: The full scanned tag payload, https://tailtag.app/t#<token>.
              required:
              - payload
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  fursuit:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                      tailtag_id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      photo_url:
                        type: string
                        format: uri
                    required:
                    - id
                    - tailtag_id
                    - name
                    - photo_url
                  convention_id:
                    type: integer
                required:
                - fursuit
                - convention_id
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  payload:
                    type: array
                    items:
                      type: string
                required:
                - payload
          description: The body is not a JSON object with one string payload.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  detail:
                    type: string
                required:
                - code
                - detail
          description: catcher_ineligible
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  detail:
                    type: string
                required:
                - code
                - detail
          description: catch_target_unavailable. While the catch request gate is off,
            every call returns the generic not-found shape.
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  detail:
                    type: string
                required:
                - code
                - detail
          description: catch_requests_unavailable or self_catch_not_allowed
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                required:
                - code
                - detail
          description: An unexpected error occurred.
  /api/catches/requests/:
    get:
      operationId: catch_requests_list
      description: List the caller's catch requests, newest first, for conventions
        whose review window is open. A closed window hides its requests.
      parameters:
      - in: query
        name: convention_id
        schema:
          type: integer
        description: Limit the list to one convention.
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerRequestList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: 'invalid_query: convention_id is not a positive integer.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: catcher_ineligible
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The catch request gate is off.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
    post:
      operationId: catch_requests_create
      description: Submit a scanned tag at the caller's selected convention. Approval
        is manual by default. A retry returns the existing pending request or catch.
      tags:
      - catches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchRequestPayload'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestSubmission'
          description: already_pending or already_caught
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestSubmission'
          description: pending or approved
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  payload:
                    type: array
                    items:
                      type: string
                required:
                - payload
          description: The body is not a JSON object with one string payload.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: catcher_ineligible
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestNotFound'
          description: catch_target_unavailable. While the catch request gate is off,
            every call returns the generic not-found shape.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: catch_requests_unavailable or self_catch_not_allowed
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next submission can succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestRefusal'
          description: cooldown_active or rate_limited
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/catches/requests/{id}/withdraw/:
    post:
      operationId: catch_requests_withdraw
      description: Withdraw the caller's pending request. A withdrawal does not count
        as a decline and does not reset a cooldown.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catches
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerRequest'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: catcher_ineligible
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionNotFound'
          description: request_not_found. While the catch request gate is off, every
            call returns the generic not-found shape.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestActionError'
          description: request_state_changed, review_window_closed
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchRequestError'
          description: server_error
  /api/conventions/:
    get:
      operationId: conventions_list
      description: Retrieve a list of conventions with safe public fields for enrollment.
      summary: List conventions
      tags:
      - conventions
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Convention'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: Authentication credentials were not provided or are invalid.
  /api/conventions/{convention_id}/catch-credentials/resolve/:
    post:
      operationId: convention_fursuit_catch_credential_resolve
      description: Resolve an opaque catch credential to a safe current preview only.
        This is not catch authorization; future Wave 3 catch writes must submit and
        independently revalidate the original payload.
      parameters:
      - in: path
        name: convention_id
        schema:
          type: integer
        required: true
      tags:
      - conventions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                payload:
                  type: string
                  pattern: ^tailtag:catch:v1:[A-Za-z0-9_-]{43}$
              required:
              - payload
      security:
      - BearerAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  convention_id:
                    type: integer
                    readOnly: true
                  fursuit:
                    type: object
                    additionalProperties: false
                    readOnly: true
                    properties:
                      tailtag_id:
                        type: string
                        format: uuid
                        readOnly: true
                      name:
                        type: string
                        readOnly: true
                      photo_url:
                        type: string
                        format: uri
                        readOnly: true
                    required:
