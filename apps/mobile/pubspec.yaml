name: tailtag_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

# The generated API client and the native Clerk bridge join the app's pub
# workspace (one lockfile).
workspace:
  - packages/tailtag_api
  - packages/tailtag_clerk

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  tailtag_api:
    path: packages/tailtag_api
  tailtag_clerk:
    path: packages/tailtag_clerk
  tonik_util: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
