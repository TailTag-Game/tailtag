name: tailtag_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

# The generated API client and the native Clerk bridge join the app's pub
# workspace (one lockfile).
workspace:
  - packages/tailtag_api
  - packages/tailtag_clerk

dependencies:
  barcode_widget: ^2.0.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  http: ^1.6.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  tailtag_api:
    path: packages/tailtag_api
  tailtag_clerk:
    path: packages/tailtag_clerk
  tonik_util: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    # The standard Google "G" from Google's sign-in assets (#478).
    - assets/images/google/
